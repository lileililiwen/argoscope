name: Repository validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Check repository bootstrap
        run: python3 scripts/verify_bootstrap.py
      - name: Validate OpenSpec
        run: |
          npm install --global @fission-ai/openspec@latest
          openspec validate --all --strict --no-interactive
      - name: Build .NET solution when present
        if: hashFiles('**/*.sln', '**/*.slnx') != ''
        run: dotnet build
      - name: Build web app when present
        if: hashFiles('web/package-lock.json') != ''
        run: |
          npm ci --prefix web
          npm run build --prefix web

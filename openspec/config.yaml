schema: spec-driven

context: |
  Product: Argoscope, open-source GitHub project portfolio analytics.
  Status: planning/bootstrap only; do not infer runtime implementation.
  Stack: ASP.NET Core 10 API, React + TypeScript web app, PostgreSQL,
  Hangfire, GitHub GraphQL/REST APIs, Docker; self-hosted single owner first.
  Metrics are sourced and timestamped; calculations are deterministic from
  snapshots; owner activity is separate from external engagement.
  A ranking is transparent and advisory, never an automatic lifecycle decision.
  Inspect dotnet-platform-libs before adding reusable web/persistence/job code.

rules:
  proposal:
    - Include package boundary, dependency map, sibling architecture evidence, and non-goals.
  design:
    - Specify API scopes, data models, timestamp/window rules, errors, rate limits, security and verification oracles.
  tasks:
    - Use BFS baseline, DFS implementation, BFS regression, and verification phases.

# Project context (optional)
# This is shown to AI when creating artifacts.
